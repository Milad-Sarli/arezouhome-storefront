<!doctype html>
<html lang="fa" dir="rtl">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="preload" href="/fonts/Dana-Regular.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/KalamehWeb-Bold.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preconnect" href="https://api.arezouhome.ir" />
		<link rel="dns-prefetch" href="https://api.arezouhome.ir" />
		<meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0d1017" media="(prefers-color-scheme: dark)" />
		<script>
			try {
				if (localStorage.getItem('arezou-theme') === 'dark') {
					document.documentElement.classList.add('dark');
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
